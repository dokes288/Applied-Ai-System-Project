<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="760" viewBox="0 0 1200 760">
  <rect width="100%" height="100%" fill="#f8fafc"/>
  <text x="600" y="48" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif" font-size="28" font-weight="700" fill="#111827">VibeMatch System Architecture</text>
  <text x="600" y="78" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif" font-size="16" fill="#4b5563">Input → Process → Output with guardrails and testing</text>

  <rect x="80" y="120" width="220" height="120" rx="12" fill="#fef3c7" stroke="#b45309" stroke-width="2"/>
  <text x="190" y="160" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif" font-size="18" font-weight="600" fill="#111827">User</text>
  <text x="190" y="188" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif" font-size="14" fill="#374151">Free-text request</text>
  <text x="190" y="208" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif" font-size="14" fill="#374151">e.g. “nostalgic synthwave”</text>

  <rect x="360" y="120" width="220" height="120" rx="12" fill="#e0f2fe" stroke="#0284c7" stroke-width="2"/>
  <text x="470" y="160" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif" font-size="18" font-weight="600" fill="#111827">CLI / Orchestrator</text>
  <text x="470" y="188" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif" font-size="14" fill="#374151">src/main.py</text>
  <text x="470" y="208" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif" font-size="14" fill="#374151">ask / reliability / evaluate</text>

  <rect x="640" y="120" width="480" height="500" rx="16" fill="#ffffff" stroke="#94a3b8" stroke-width="2"/>
  <text x="880" y="150" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif" font-size="20" font-weight="600" fill="#111827">RAG Pipeline</text>

  <rect x="680" y="180" width="180" height="90" rx="10" fill="#ede9fe" stroke="#7c3aed" stroke-width="2"/>
  <text x="770" y="210" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif" font-size="16" font-weight="600" fill="#111827">1. Parse</text>
  <text x="770" y="236" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif" font-size="13" fill="#374151">Claude or offline parser</text>

  <rect x="900" y="180" width="180" height="90" rx="10" fill="#dcfce7" stroke="#16a34a" stroke-width="2"/>
  <text x="990" y="210" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif" font-size="16" font-weight="600" fill="#111827">Profile Guardrail</text>
  <text x="990" y="236" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif" font-size="13" fill="#374151">Validate and clamp</text>

  <rect x="680" y="330" width="180" height="90" rx="10" fill="#ede9fe" stroke="#7c3aed" stroke-width="2"/>
  <text x="770" y="360" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif" font-size="16" font-weight="600" fill="#111827">2. Retrieve</text>
  <text x="770" y="386" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif" font-size="13" fill="#374151">recommend_songs()</text>

  <rect x="900" y="330" width="180" height="90" rx="10" fill="#ede9fe" stroke="#7c3aed" stroke-width="2"/>
  <text x="990" y="360" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif" font-size="16" font-weight="600" fill="#111827">3. Generate</text>
  <text x="990" y="386" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif" font-size="13" fill="#374151">Claude or offline answer</text>

  <rect x="790" y="470" width="220" height="110" rx="10" fill="#dcfce7" stroke="#16a34a" stroke-width="2"/>
  <text x="900" y="500" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif" font-size="16" font-weight="600" fill="#111827">Grounding Guard</text>
  <text x="900" y="526" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif" font-size="13" fill="#374151">Only names retrieved songs</text>

  <rect x="790" y="620" width="220" height="70" rx="10" fill="#fef3c7" stroke="#b45309" stroke-width="2"/>
  <text x="900" y="650" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif" font-size="16" font-weight="600" fill="#111827">Grounded Recommendation</text>

  <rect x="80" y="320" width="260" height="180" rx="12" fill="#e0e7ff" stroke="#4338ca" stroke-width="2"/>
  <text x="210" y="350" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif" font-size="18" font-weight="600" fill="#111827">Retriever Data</text>
  <text x="210" y="378" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif" font-size="14" fill="#374151">Content-based scorer</text>
  <text x="210" y="404" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif" font-size="14" fill="#374151">src/recommender.py</text>
  <text x="210" y="430" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif" font-size="14" fill="#374151">data/songs.csv</text>
  <text x="210" y="456" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif" font-size="14" fill="#374151">top-k songs + reasons</text>

  <rect x="80" y="560" width="300" height="140" rx="12" fill="#fef2f2" stroke="#dc2626" stroke-width="2"/>
  <text x="230" y="590" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif" font-size="18" font-weight="600" fill="#111827">Evaluation &amp; Testing</text>
  <text x="230" y="618" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif" font-size="14" fill="#374151">src/reliability.py</text>
  <text x="230" y="642" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif" font-size="14" fill="#374151">pytest tests/test_rag.py</text>
  <text x="230" y="666" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif" font-size="14" fill="#374151">Developer reviews PASS/FAIL</text>

  <line x1="300" y1="180" x2="360" y2="180" stroke="#374151" stroke-width="2" marker-end="url(#arrow)"/>
  <line x1="580" y1="180" x2="640" y2="180" stroke="#374151" stroke-width="2" marker-end="url(#arrow)"/>
  <line x1="770" y1="270" x2="770" y2="330" stroke="#374151" stroke-width="2" marker-end="url(#arrow)"/>
  <line x1="990" y1="270" x2="990" y2="330" stroke="#374151" stroke-width="2" marker-end="url(#arrow)"/>
  <line x1="860" y1="420" x2="900" y2="470" stroke="#374151" stroke-width="2" marker-end="url(#arrow)"/>
  <line x1="900" y1="580" x2="900" y2="620" stroke="#374151" stroke-width="2" marker-end="url(#arrow)"/>
  <line x1="340" y1="400" x2="680" y2="380" stroke="#374151" stroke-width="2" marker-end="url(#arrow)"/>
  <line x1="230" y1="500" x2="230" y2="560" stroke="#374151" stroke-width="2" marker-end="url(#arrow)"/>
  <line x1="900" y1="650" x2="760" y2="650" stroke="#374151" stroke-width="2" marker-end="url(#arrow)"/>

  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L0,6 L9,3 z" fill="#374151"/>
    </marker>
  </defs>
</svg>
